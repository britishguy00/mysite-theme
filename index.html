<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Community Portal</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #313338; display: flex; height: 100vh; overflow: hidden; color: #dbdee1; user-select: none; }
    
    /* LEFT SERVER BAR */
    .server-list { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
    .server-icon { width: 48px; height: 48px; background-color: #313338; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #dbdee1; font-size: 18px; cursor: pointer; transition: border-radius 0.2s, background-color 0.2s; }
    .server-icon.active, .server-icon:hover { border-radius: 16px; background-color: #5865f2; color: white; }
    .server-separator { width: 32px; height: 2px; background-color: #35373c; border-radius: 1px; margin: 4px 0; }

    /* CHANNELS SIDEBAR */
    .channel-sidebar { width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; flex-shrink: 0; justify-content: space-between; }
    .server-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; font-weight: bold; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .channel-scroll { flex-grow: 1; padding: 12px 8px; overflow-y: auto; }
    .category-title { font-size: 12px; font-weight: bold; color: #949ba4; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; margin: 16px 0 4px 4px; }
    .channel-btn { padding: 6px 8px; border-radius: 4px; font-weight: 500; font-size: 15px; color: #949ba4; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .channel-btn:hover, .channel-btn.active { background-color: #35373c; color: #dbdee1; }
    .channel-btn.active { color: white; background-color: #404249; }
    .channel-hash { font-size: 20px; color: #80848e; }

    /* USER PANEL (BOTTOM LEFT) */
    .user-panel { height: 52px; background-color: #232428; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; background-color: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 14px; position: relative; }
    .status-dot { width: 10px; height: 10px; background-color: #23a55a; border-radius: 50%; position: absolute; bottom: -2px; right: -2px; border: 2px solid #232428; }
    .user-name-tag { display: flex; flex-direction: column; font-size: 13px; }
    .username-txt { color: white; font-weight: bold; }
    .status-txt { color: #949ba4; font-size: 11px; }

    /* MAIN CHAT INTERFACE WINDOW */
    .main-content { flex-grow: 1; display: flex; flex-direction: column; background-color: #313338; }
    .chat-header-bar { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; padding: 0 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); z-index: 2; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 8px; font-weight: bold; color: white; font-size: 16px; }
    
    .lower-split { display: flex; flex-grow: 1; height: calc(100% - 48px); }
    
    /* 1:1 DISCORD MESSAGE FEED DESIGN */
    .chat-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; background-color: #313338; height: 100%; }
    .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    
    .msg-group { display: flex; gap: 16px; align-items: flex-start; }
    .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #e67e22; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
    .msg-details { display: flex; flex-direction: column; }
    .msg-meta { display: flex; align-items: baseline; gap: 8px; }
    .msg-user { color: white; font-weight: 500; font-size: 15px; cursor: pointer; }
    .msg-user:hover { text-decoration: underline; }
    .msg-time { color: #949ba4; font-size: 12px; }
    .msg-content { color: #dbdee1; font-size: 15px; margin-top: 4px; line-break: anywhere; }

    /* 1:1 DISCORD INPUT BOX */
    .chat-input-area { padding: 0 20px 24px 20px; background-color: #313338; }
    .input-wrapper { background-color: #383a40; border-radius: 8px; padding: 11px 16px; display: flex; align-items: center; }
    .input-wrapper input { background: none; border: none; width: 100%; color: #dbdee1; font-size: 15px; outline: none; }
    .input-wrapper input::placeholder { color: #6d737d; }

    /* ONLINE MEMBERS ROSTER PANEL */
    .member-roster { width: 240px; background-color: #2b2d31; padding: 24px 16px; box-sizing: border-box; flex-shrink: 0; border-left: 1px solid #1f2023; }
    .roster-section { font-size: 12px; font-weight: bold; color: #949ba4; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .member-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; }
    .member-row:hover { background-color: #35373c; }
    .member-name { font-size: 15px; color: #949ba4; font-weight: 500; }
    .owner-tag { color: #f0b232 !important; }
  </style>
</head>
<body>

  <div class="server-list">
    <div class="server-icon active">🏠</div>
    <div class="server-separator"></div>
    <div class="server-icon">⚔️</div>
  </div>

  <div class="channel-sidebar">
    <div class="server-header"><span>🏫 Study Guild</span></div>
    <div class="channel-scroll">
      <div class="category-title">▼ Text Channels</div>
      <div class="channel-btn active"><span class="channel-hash">#</span> general-chat</div>
    </div>

    <div class="user-panel">
      <div class="user-info">
        <div class="avatar" style="background-color: #5865f2;">W<div class="status-dot"></div></div>
        <div class="user-name-tag"><span class="username-txt">Wumpus</span><span class="status-txt">Online</span></div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="chat-header-bar">
      <div class="header-left"><span style="color:#80848e; font-size:24px;">#</span><span>general-chat</span></div>
    </div>
    
    <div class="lower-split">
      <div class="chat-area">
        <!-- Live Chat Bubble Feed Container -->
        <div class="chat-messages" id="chatBox">
          <div class="msg-group">
            <div class="msg-avatar" style="background-color: #f0b232;">A</div>
            <div class="msg-details">
              <div class="msg-meta"><span class="msg-user owner-tag">Admin/Teacher</span><span class="msg-time">12:00 PM</span></div>
              <div class="msg-content">Welcome to the mock server! Type below to chat live. (Note: Without a spreadsheet database, history will clear if you refresh the website!)</div>
            </div>
          </div>
        </div>
        
        <div class="chat-input-area">
          <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Message #general-chat" onkeydown="if(event.key==='Enter') handleSend()">
          </div>
        </div>
      </div>
      
      <div class="member-roster">
        <div class="roster-section">Online — 2</div>
        <div class="member-row"><div class="avatar" style="background-color: #f0b232;">A</div><span class="member-name owner-tag">Admin/Teacher</span></div>
        <div class="member-row"><div class="avatar" style="background-color: #5865f2;">W</div><span class="member-name">Wumpus</span></div>
      </div>
    </div>
  </div>

  <!-- THE INTERACTIVE ENGINE JAVASCRIPT HACK -->
  <script>
    function handleSend() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Generate a 1:1 exact Discord chat bubble framework element
      const msgGroup = document.createElement('div');
      msgGroup.className = 'msg-group';
      msgGroup.innerHTML = `
        <div class="msg-avatar" style="background-color: #5865f2;">W</div>
        <div class="msg-details">
          <div class="msg-meta">
            <span class="msg-user">Wumpus</span>
            <span class="msg-time">${timeStr}</span>
          </div>
          <div class="msg-content">${escapeHTML(text)}</div>
        </div>
      `;

      chatBox.appendChild(msgGroup);
      input.value = ''; // Reset input box
      chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll downward
    }

    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
